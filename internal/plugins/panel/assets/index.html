<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MagiBox 面板</title>
<style>
:root{
  --bg:#F8FAFC; --card:#FFFFFF; --fg:#0F172A; --muted:#F2F3F4; --muted-fg:#64748B;
  --border:#E6E8EA; --primary:#334155; --on-primary:#FFFFFF; --accent:#059669;
  --danger:#DC2626; --ring:#334155;
  --sidebar:240px; --header:56px; --row-h:36px; --pad:12px; --radius:8px;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#020617; --card:#0E1223; --fg:#F8FAFC; --muted:#1A1E2F; --muted-fg:#94A3B8;
    --border:#334155; --primary:#475569; --on-primary:#F8FAFC; --accent:#22C55E;
    --danger:#EF4444; --ring:#94A3B8;
  }
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.5}
button{font-family:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--ring);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* login */
.login-wrap{min-height:100%;display:grid;place-items:center;padding:24px}
.login{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:28px;width:100%;max-width:360px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.login h1{font-size:18px;margin:0 0 4px}
.login p{color:var(--muted-fg);font-size:13px;margin:0 0 18px}
.login input{width:100%}
.login .err{color:var(--danger);font-size:13px;min-height:18px;margin-top:8px}

/* app shell */
.app{display:grid;grid-template-columns:var(--sidebar) 1fr;grid-template-rows:var(--header) 1fr;
  grid-template-areas:"brand top" "nav main";height:100%}
.brand{grid-area:brand;display:flex;align-items:center;gap:8px;padding:0 16px;
  border-bottom:1px solid var(--border);border-right:1px solid var(--border);font-weight:600}
.brand svg{color:var(--accent)}
.top{grid-area:top;display:flex;align-items:center;justify-content:space-between;
  padding:0 16px;border-bottom:1px solid var(--border);gap:12px}
.top .title{font-weight:600}
nav{grid-area:nav;border-right:1px solid var(--border);padding:8px;overflow-y:auto}
nav .group{color:var(--muted-fg);font-size:11px;text-transform:uppercase;letter-spacing:.04em;
  padding:12px 10px 4px}
nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;
  border:none;color:var(--fg);padding:8px 10px;border-radius:6px;font-size:13.5px;transition:background .15s}
nav button:hover{background:var(--muted)}
nav button.active{background:var(--muted);color:var(--fg);font-weight:600}
nav button svg{color:var(--muted-fg);flex:none}
nav button.active svg{color:var(--accent)}
main{grid-area:main;overflow:auto;padding:16px}

/* controls */
input,select{background:var(--card);color:var(--fg);border:1px solid var(--border);
  border-radius:6px;padding:8px 10px;font-size:13.5px}
input:focus,select:focus{outline:none;border-color:var(--ring)}
.btn{background:var(--primary);color:var(--on-primary);border:none;border-radius:6px;
  padding:8px 14px;font-size:13px;font-weight:500;transition:filter .15s}
.btn:hover{filter:brightness(1.08)}
.btn.sm{padding:5px 10px;font-size:12px}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--border)}
.btn.ghost:hover{background:var(--muted);filter:none}
.btn.danger{background:transparent;color:var(--danger);border:1px solid var(--border)}
.btn.danger:hover{background:var(--danger);color:#fff}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}

/* cards + tables */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:16px}
.card h2{font-size:14px;margin:0;padding:12px 14px;border-bottom:1px solid var(--border);font-weight:600}
.card .body{padding:14px}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{position:sticky;top:0;background:var(--muted);color:var(--muted-fg);font-weight:600;
  text-align:left;padding:0 12px;height:34px;white-space:nowrap;font-size:12px}
td{padding:0 12px;height:var(--row-h);border-top:1px solid var(--border);white-space:nowrap}
tr:hover td{background:var(--muted)}
td.mono,th.mono{font-family:var(--mono);font-size:12px}
.badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11.5px;font-weight:600}
.badge.unused{background:var(--muted);color:var(--muted-fg)}
.badge.used{background:color-mix(in srgb,var(--accent) 18%,transparent);color:var(--accent)}
.badge.banned{background:color-mix(in srgb,var(--danger) 16%,transparent);color:var(--danger)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--border)}
.dot.on{background:var(--accent)}
.muted{color:var(--muted-fg)}
.empty{padding:24px;text-align:center;color:var(--muted-fg);font-size:13px}
.actions{display:flex;gap:6px;justify-content:flex-end}

/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;place-items:center;padding:20px;z-index:20}
.modal-bg.open{display:grid}
.modal{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  width:100%;max-width:460px;max-height:90vh;overflow:auto}
.modal h3{margin:0;padding:14px 16px;border-bottom:1px solid var(--border);font-size:15px}
.modal .body{padding:16px;display:grid;gap:12px}
.field{display:grid;gap:5px}
.field label{font-size:12px;color:var(--muted-fg)}
.field input,.field select{width:100%}
.modal .foot{display:flex;justify-content:flex-end;gap:8px;padding:14px 16px;border-top:1px solid var(--border)}
.toggle{display:flex;align-items:center;gap:8px}

/* toast */
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--fg);
  color:var(--bg);padding:10px 16px;border-radius:8px;font-size:13px;opacity:0;pointer-events:none;
  transition:opacity .2s;max-width:90vw;z-index:30}
#toast.show{opacity:1}
#toast.err{background:var(--danger);color:#fff}

@media (max-width:720px){
  .app{grid-template-columns:1fr;grid-template-rows:var(--header) auto 1fr;
    grid-template-areas:"top" "nav" "main"}
  .brand{display:none}
  .top{border-right:none}
  nav{border-right:none;border-bottom:1px solid var(--border);
    display:flex;gap:4px;overflow-x:auto;padding:6px 8px}
  nav .group{display:none}
  nav button{width:auto;white-space:nowrap;padding:6px 12px}
}
</style>
</head>
<body>
<div id="root"></div>
<div class="modal-bg" id="modalBg"><div class="modal" id="modal"></div></div>
<div id="toast"></div>

<script>
const $ = (s,el=document)=>el.querySelector(s);
const h = (html)=>{const t=document.createElement('template');t.innerHTML=html.trim();return t.content.firstChild;};
const esc = (s)=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ICON={
  globe:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18M12 3a15 15 0 0 0 0 18"/></svg>',
  server:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="7" rx="1"/><rect x="3" y="13" width="18" height="7" rx="1"/><path d="M7 8h.01M7 17h.01"/></svg>',
  key:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="8" cy="15" r="4"/><path d="M10.8 12.2 20 3m-4 1 2 2m-5 1 2 2"/></svg>',
  activity:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h4l3 8 4-16 3 8h4"/></svg>',
  bell:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>',
  box:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 8 12 3 3 8v8l9 5 9-5Z"/><path d="M3 8l9 5 9-5M12 13v8"/></svg>',
};
let STATE=null, TAB='domains', kumaMonitors={};

async function api(path, opts={}){
  const res = await fetch('/panel'+path, {headers:{'Content-Type':'application/json'}, ...opts});
  let data={}; try{data=await res.json();}catch(e){}
  if(!res.ok) throw Object.assign(new Error(data.error||('HTTP '+res.status)), {status:res.status, data});
  return data;
}
function toast(msg, err=false){const t=$('#toast');t.textContent=msg;t.className=(err?'err ':'')+'show';setTimeout(()=>t.className='',2200);}

/* ---------- login ---------- */
function renderLogin(msg=''){
  $('#root').innerHTML='';
  const box=h(`<div class="login-wrap"><form class="login">
    <h1>${ICON.box} MagiBox 面板</h1>
    <p>输入授权码登录</p>
    <input id="code" type="password" placeholder="授权码" autocomplete="current-password" autofocus>
    <div class="err">${esc(msg)}</div>
    <div class="row" style="margin-top:14px"><button class="btn" style="width:100%">登录</button></div>
  </form></div>`);
  box.querySelector('form').onsubmit=async(e)=>{
    e.preventDefault();
    try{ await api('/api/login',{method:'POST',body:JSON.stringify({code:$('#code',box).value})}); boot(); }
    catch(err){ renderLogin(err.message||'登录失败'); }
  };
  $('#root').appendChild(box);
}

/* ---------- shell ---------- */
const NAV=[
  {group:'Cloudflare',items:[
    {id:'domains',label:'域名',icon:'globe'},
    {id:'workers',label:'Worker',icon:'server'},
    {id:'creds',label:'凭据',icon:'key'},
  ]},
  {group:'监控',items:[
    {id:'kuma',label:'Uptime Kuma',icon:'activity'},
    {id:'uptime',label:'回调监听',icon:'bell'},
  ]},
];
function renderShell(){
  $('#root').innerHTML='';
  const nav=NAV.map(g=>`<div class="group">${g.group}</div>`+g.items.map(it=>
    `<button data-tab="${it.id}" class="${TAB===it.id?'active':''}">${ICON[it.icon]}<span>${it.label}</span></button>`).join('')).join('');
  const app=h(`<div class="app">
    <div class="brand">${ICON.box}<span>MagiBox</span></div>
    <div class="top"><div class="title" id="tabTitle"></div>
      <div class="row"><button class="btn ghost sm" id="refresh">刷新</button><button class="btn ghost sm" id="logout">退出</button></div></div>
    <nav>${nav}</nav>
    <main id="main"></main></div>`);
  $('#root').appendChild(app);
  app.querySelectorAll('nav button[data-tab]').forEach(b=>b.onclick=()=>{TAB=b.dataset.tab;renderShell();});
  $('#refresh',app).onclick=()=>boot();
  $('#logout',app).onclick=async()=>{await api('/api/logout',{method:'POST'});renderLogin();};
  renderTab();
}
const TITLES={domains:'域名记录',workers:'Worker',creds:'Cloudflare 凭据',kuma:'Uptime Kuma 监控',uptime:'回调监听'};
function renderTab(){
  $('#tabTitle').textContent=TITLES[TAB]||'';
  const m=$('#main'); m.innerHTML='';
  ({domains:tabDomains,workers:tabWorkers,creds:tabCreds,kuma:tabKuma,uptime:tabUptime}[TAB]||(()=>{}))(m);
}

/* ---------- domains ---------- */
function statusBadge(s){const t={unused:'未使用',used:'已使用',banned:'被ban'}[s]||s;return `<span class="badge ${s}">${t}</span>`;}
function tabDomains(m){
  const d=STATE.cf.domains, cats=[...new Set(d.map(x=>x.category))].sort();
  const add=h(`<div class="card"><h2>录入域名</h2><div class="body"><div class="row">
    <input id="aCat" placeholder="大类" style="width:130px">
    <input id="aDom" placeholder="域名(逗号分隔多个)" style="flex:1;min-width:200px">
    <input id="aSub" placeholder="小类(可选)" style="width:120px">
    <button class="btn" id="aBtn">添加</button></div></div></div>`);
  add.querySelector('#aBtn').onclick=async()=>{
    const category=$('#aCat',add).value.trim(), domains=$('#aDom',add).value.trim(), sub=$('#aSub',add).value.trim();
    if(!category||!domains) return toast('大类和域名必填',true);
    try{const r=await api('/api/cf/domain/add',{method:'POST',body:JSON.stringify({category,domains,sub})});
      toast(`已添加 ${r.added.length} 个${r.failed.length?(',跳过 '+r.failed.length):''}`); boot();
    }catch(e){toast(e.message,true);}
  };
  m.appendChild(add);

  const filt=h(`<div class="row" style="margin-bottom:12px">
    <select id="fCat"><option value="">全部大类</option>${cats.map(c=>`<option>${esc(c)}</option>`).join('')}</select>
    <select id="fStatus"><option value="">全部状态</option><option value="unused">未使用</option><option value="used">已使用</option><option value="banned">被ban</option></select>
    <span class="spacer"></span><span class="muted" id="count"></span></div>`);
  m.appendChild(filt);

  const card=h(`<div class="card"><div class="tablewrap"><table><thead><tr>
    <th>域名</th><th>分类</th><th>状态</th><th>就绪</th><th>Worker</th><th>更换时间</th><th></th>
  </tr></thead><tbody id="dbody"></tbody></table></div></div>`);
  m.appendChild(card);

  const draw=()=>{
    const fc=$('#fCat',filt).value, fs=$('#fStatus',filt).value;
    const rows=d.filter(x=>(!fc||x.category===fc)&&(!fs||x.status===fs));
    $('#count',filt).textContent=`${rows.length} / ${d.length} 条`;
    const tb=$('#dbody',card); tb.innerHTML='';
    if(!rows.length){tb.appendChild(h('<tr><td colspan="7"><div class="empty">没有匹配的域名</div></td></tr>'));return;}
    rows.forEach(x=>{
      const cls=[esc(x.category),x.sub?('/'+esc(x.sub)):''].join(' ');
      const tr=h(`<tr>
        <td class="mono">${esc(x.name)}</td><td>${cls}</td><td>${statusBadge(x.status)}</td>
        <td><span class="dot ${x.ready?'on':''}" title="${x.ready?'就绪':'未就绪'}"></span></td>
        <td>${x.worker?esc(x.worker):'<span class="muted">—</span>'}</td>
        <td class="muted mono">${esc(x.changed_at||'—')}</td>
        <td><div class="actions">
          <button class="btn ghost sm" data-a="edit">编辑</button>
          ${x.worker?'<button class="btn ghost sm" data-a="unbind">解绑</button>':'<button class="btn sm" data-a="bind">绑定</button>'}
          <button class="btn danger sm" data-a="del">删</button>
        </div></td></tr>`);
      tr.querySelector('[data-a=edit]').onclick=()=>editDomain(x);
      tr.querySelector('[data-a=del]').onclick=()=>delDomain(x);
      const bb=tr.querySelector('[data-a=bind]'); if(bb) bb.onclick=()=>bindDomain(x);
      const ub=tr.querySelector('[data-a=unbind]'); if(ub) ub.onclick=()=>unbindDomain(x);
      tb.appendChild(tr);
    });
  };
  $('#fCat',filt).onchange=draw; $('#fStatus',filt).onchange=draw; draw();
}

function editDomain(x){
  openModal(`编辑 ${esc(x.name)}`,`
    <div class="field"><label>状态</label><select id="e_status">
      ${['unused','used','banned'].map(s=>`<option value="${s}" ${x.status===s?'selected':''}>${({unused:'未使用',used:'已使用',banned:'被ban'})[s]}</option>`).join('')}</select></div>
    <div class="field"><label>大类</label><input id="e_category" value="${esc(x.category)}"></div>
    <div class="field"><label>小类</label><input id="e_sub" value="${esc(x.sub)}"></div>
    <div class="field"><label>购买日期</label><input id="e_purchased" value="${esc(x.purchased_at)}" placeholder="2024-01-15"></div>
    <div class="field"><label>准备用在哪里</label><input id="e_usage" value="${esc(x.usage)}"></div>
    <div class="field"><label>DNS</label><input id="e_dns" value="${esc(x.dns)}"></div>
    <div class="field"><label>更换时间</label><input id="e_changed" value="${esc(x.changed_at)}"></div>
    <div class="field"><div class="toggle"><input type="checkbox" id="e_ready" ${x.ready?'checked':''}><label for="e_ready" style="color:var(--fg)">已准备就绪</label></div></div>
  `,async(root)=>{
    const fields={
      status:$('#e_status',root).value, category:$('#e_category',root).value.trim(),
      sub:$('#e_sub',root).value.trim(), purchased:$('#e_purchased',root).value.trim(),
      usage:$('#e_usage',root).value.trim(), dns:$('#e_dns',root).value.trim(),
      changed:$('#e_changed',root).value.trim(), ready:$('#e_ready',root).checked?'yes':'no',
    };
    const orig={status:x.status,category:x.category,sub:x.sub,purchased:x.purchased_at,
      usage:x.usage,dns:x.dns,changed:x.changed_at,ready:x.ready?'yes':'no'};
    for(const [f,v] of Object.entries(fields)){
      if(v===(orig[f]||'')) continue;
      await api('/api/cf/domain/set',{method:'POST',body:JSON.stringify({domain:x.name,field:f,value:v})});
    }
    toast('已保存'); boot();
  });
}
async function delDomain(x){
  if(!confirm(`删除记录 ${x.name}?(不影响 Cloudflare 上的绑定)`))return;
  try{await api('/api/cf/domain/del',{method:'POST',body:JSON.stringify({domain:x.name})});toast('已删除');boot();}
  catch(e){toast(e.message,true);}
}
function bindDomain(x){
  const workers=STATE.cf.workers;
  if(!workers.length) return toast('还没有 worker,请先在 bot 里 /cf worker add',true);
  openModal(`绑定 ${esc(x.name)}`,`
    <div class="field"><label>选择 Worker</label><select id="b_worker">
      ${workers.map(w=>`<option value="${esc(w.name)}">${esc(w.name)} (${esc(w.cred)})</option>`).join('')}</select></div>
    <p class="muted" style="margin:0;font-size:12px">将把该域名作为 Worker Custom Domain 绑定,并标记为「已使用」。</p>
  `,async(root)=>{
    const worker=$('#b_worker',root).value;
    await doBind(worker, x.name, false);
  },'绑定');
}
async function doBind(worker, domain, force){
  try{
    const r=await api('/api/cf/bind',{method:'POST',body:JSON.stringify({worker,domain,force})});
    toast(`已绑定到 ${r.worker}(zone ${r.zone})`); closeModal(); boot();
  }catch(e){
    if(e.status===409 && e.data && e.data.conflict){
      if(confirm(`${e.data.domain} 已绑定到 worker「${e.data.current_worker}」,强制替换?`)){ await doBind(worker,domain,true); }
      return;
    }
    toast(e.message,true);
  }
}
async function unbindDomain(x){
  if(!confirm(`解绑 ${x.name}?`))return;
  try{await api('/api/cf/unbind',{method:'POST',body:JSON.stringify({domain:x.name})});toast('已解绑');boot();}
  catch(e){toast(e.message,true);}
}

/* ---------- workers / creds ---------- */
function tabWorkers(m){
  const ws=STATE.cf.workers;
  const card=h(`<div class="card"><h2>Worker(创建/删除在 bot 里 /cf worker)</h2><div class="tablewrap"><table>
    <thead><tr><th>名称</th><th>凭据</th><th>大类</th><th>环境</th></tr></thead><tbody></tbody></table></div></div>`);
  const tb=card.querySelector('tbody');
  if(!ws.length) tb.appendChild(h('<tr><td colspan="4"><div class="empty">还没有 worker</div></td></tr>'));
  ws.forEach(w=>tb.appendChild(h(`<tr><td class="mono">${esc(w.name)}</td><td>${esc(w.cred)}</td>
    <td>${w.category?esc(w.category):'<span class="muted">—</span>'}</td><td class="muted">${esc(w.env)}</td></tr>`)));
  m.appendChild(card);
}
function tabCreds(m){
  const cs=STATE.cf.creds;
  const card=h(`<div class="card"><h2>Cloudflare 凭据(增删在 bot 里 /cf cred)</h2><div class="tablewrap"><table>
    <thead><tr><th>名称</th><th>Account ID</th><th>Token</th></tr></thead><tbody></tbody></table></div></div>`);
  const tb=card.querySelector('tbody');
  if(!cs.length) tb.appendChild(h('<tr><td colspan="3"><div class="empty">还没有凭据</div></td></tr>'));
  cs.forEach(c=>tb.appendChild(h(`<tr><td>${esc(c.name)}</td><td class="mono">${esc(c.account_id)}</td><td class="mono muted">${esc(c.token)}</td></tr>`)));
  m.appendChild(card);
}

/* ---------- kuma ---------- */
function tabKuma(m){
  const cs=STATE.kuma.creds;
  if(!cs.length){m.appendChild(h('<div class="card"><div class="empty">还没有 Kuma 凭据。请在 bot 里 /kuma cred add</div></div>'));return;}
  const add=h(`<div class="card"><h2>建监控(URL 取 https://域名)</h2><div class="body"><div class="row">
    <select id="kCred">${cs.map(c=>`<option>${esc(c.name)}</option>`).join('')}</select>
    <input id="kDom" placeholder="域名" style="flex:1;min-width:180px">
    <button class="btn" id="kAdd">建监控</button></div></div></div>`);
  add.querySelector('#kAdd').onclick=async()=>{
    const cred=$('#kCred',add).value, domain=$('#kDom',add).value.trim();
    if(!domain) return toast('域名必填',true);
    try{const r=await api('/api/kuma/add',{method:'POST',body:JSON.stringify({cred,domain})});
      toast('已建监控'+(r.id?(' #'+r.id):'')); $('#kDom',add).value=''; loadMonitors(cred);
    }catch(e){toast(e.message,true);}
  };
  m.appendChild(add);

  const card=h(`<div class="card"><h2 class="row" style="justify-content:space-between">
    <span>现有监控</span>
    <span class="row"><select id="mCred">${cs.map(c=>`<option>${esc(c.name)}</option>`).join('')}</select>
    <button class="btn ghost sm" id="mLoad">拉取</button></span></h2>
    <div class="tablewrap"><table><thead><tr><th>#</th><th>名称</th><th>URL</th><th></th></tr></thead>
    <tbody id="mbody"><tr><td colspan="4"><div class="empty">选择凭据后点「拉取」</div></td></tr></tbody></table></div></div>`);
  m.appendChild(card);
  $('#mLoad',card).onclick=()=>loadMonitors($('#mCred',card).value);
}
async function loadMonitors(cred){
  const tb=$('#mbody'); if(!tb) return;
  tb.innerHTML='<tr><td colspan="4"><div class="empty">加载中…</div></td></tr>';
  try{
    const r=await api('/api/kuma/monitors?cred='+encodeURIComponent(cred));
    const ms=r.monitors||[]; tb.innerHTML='';
    if(!ms.length){tb.innerHTML='<tr><td colspan="4"><div class="empty">这个 Kuma 没有监控</div></td></tr>';return;}
    ms.forEach(mo=>{
      const tr=h(`<tr><td class="mono">${mo.id}</td><td>${esc(mo.name)}</td><td class="mono muted">${esc(mo.url||'')}</td>
        <td><div class="actions"><button class="btn danger sm">删</button></div></td></tr>`);
      tr.querySelector('button').onclick=async()=>{
        if(!confirm(`删除监控 #${mo.id} ${mo.name}?`))return;
        try{await api('/api/kuma/del',{method:'POST',body:JSON.stringify({cred,id:mo.id})});toast('已删除');loadMonitors(cred);}
        catch(e){toast(e.message,true);}
      };
      tb.appendChild(tr);
    });
  }catch(e){tb.innerHTML=`<tr><td colspan="4"><div class="empty">加载失败:${esc(e.message)}</div></td></tr>`;}
}

/* ---------- uptime ---------- */
function tabUptime(m){
  const ws=STATE.uptime.watchers;
  const card=h(`<div class="card"><h2>回调监听(配置在 bot 里 /uptime)</h2><div class="tablewrap"><table>
    <thead><tr><th>名称</th><th>通知目标</th><th>字段 / 文案</th></tr></thead><tbody></tbody></table></div></div>`);
  const tb=card.querySelector('tbody');
  if(!ws.length) tb.appendChild(h('<tr><td colspan="3"><div class="empty">还没有回调监听</div></td></tr>'));
  ws.forEach(w=>{
    const spec=w.has_template?'自定义文案':((w.fields&&w.fields.length)?w.fields.join(', '):'<span class="muted">默认</span>');
    tb.appendChild(h(`<tr><td>${esc(w.name)}</td><td class="mono">${w.target?w.target:'<span class="muted">未设</span>'}</td><td>${spec}</td></tr>`));
  });
  m.appendChild(card);
}

/* ---------- modal ---------- */
function openModal(title, bodyHTML, onSave, saveLabel='保存'){
  const modal=$('#modal');
  modal.innerHTML=`<h3>${title}</h3><div class="body">${bodyHTML}</div>
    <div class="foot"><button class="btn ghost" id="mCancel">取消</button><button class="btn" id="mSave">${saveLabel}</button></div>`;
  $('#modalBg').classList.add('open');
  $('#mCancel',modal).onclick=closeModal;
  $('#mSave',modal).onclick=async()=>{
    const btn=$('#mSave',modal); btn.disabled=true;
    try{await onSave(modal);}catch(e){toast(e.message,true);btn.disabled=false;}
  };
}
function closeModal(){$('#modalBg').classList.remove('open');$('#modal').innerHTML='';}
$('#modalBg').onclick=(e)=>{if(e.target===$('#modalBg'))closeModal();};
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});

/* ---------- boot ---------- */
async function boot(){
  try{ STATE=await api('/api/state'); renderShell(); }
  catch(e){ if(e.status===401) renderLogin(); else { renderLogin('加载失败:'+e.message); } }
}
boot();
</script>
